name: AutoFilm OpenList deployment image

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_deployment_amd64:
    name: Release deployment image (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Test customized components
        run: go test ./drivers/115 ./drivers/quark_open ./internal/resticquota ./server/restic

      - name: Checkout AutoFilm OpenList frontend
        uses: actions/checkout@v7
        with:
          repository: ahaduoduoduo/autofilm-openlist-frontend
          ref: main
          path: autofilm-openlist-frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push deployment image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.autofilm
          build-contexts: |
            autofilm_frontend=${{ github.workspace }}/autofilm-openlist-frontend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ahaduoduoduo/autofilm-openlist-restic:gateway
            ghcr.io/ahaduoduoduo/autofilm-openlist-restic:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.autofilm.openlist.ref=${{ github.ref_name }}
            io.autofilm.openlist-frontend.ref=main
          cache-from: type=gha,scope=autofilm-openlist-restic
          cache-to: type=gha,mode=max,scope=autofilm-openlist-restic
